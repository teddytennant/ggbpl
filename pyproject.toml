[project]
name = "ggbpl"
version = "0.1.0"
description = "Generalized Geometry Block Proximal Linearized method (GGBPL) and inertial GGBPL for l0-constrained sparse nonnegative matrix factorization"
requires-python = ">=3.11"
dependencies = [
    "jax",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
